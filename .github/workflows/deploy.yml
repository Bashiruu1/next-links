name: Build & Deploy

on:
  push:
    branches: [main]
  # Rebuild daily at 6 AM UTC — keeps TikTok thumbnails fresh
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Tests ───────────────────────────────────────────────────────────────
      # Vitest exits with a non-zero code on any failure, which fails the job.
      - name: Run tests
        run: npm run test:run

      # ── Build ────────────────────────────────────────────────────────────────
      # TikTok oEmbed thumbnails are fetched here at build time.
      - name: Build static site
        run: npm run build
        # Add any env vars needed at build time here, e.g.:
        # env:
        #   NEXT_PUBLIC_SOME_KEY: ${{ secrets.SOME_KEY }}

      # ── Deploy to GitHub Pages ───────────────────────────────────────────────
      # Skipped automatically when running locally via `act` (ACT env var is set).
      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          destination_dir: .
