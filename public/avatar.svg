<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background with warm gradient -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c9a07a"/>
      <stop offset="100%" stop-color="#7d5036"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Decorative quadrant pattern (inspired by sarah.bashir's mosaic avatar) -->
  <g clip-path="url(#circle)">
    <!-- Top-left: animal print style -->
    <rect x="0" y="0" width="100" height="100" fill="#8B5E3C"/>
    <circle cx="30" cy="30" r="12" fill="#6B3D1E" opacity="0.6"/>
    <circle cx="70" cy="20" r="8" fill="#6B3D1E" opacity="0.5"/>
    <circle cx="55" cy="60" r="10" fill="#6B3D1E" opacity="0.4"/>
    <circle cx="20" cy="75" r="7" fill="#6B3D1E" opacity="0.5"/>
    <!-- Top-right: striped style -->
    <rect x="100" y="0" width="100" height="100" fill="#C4956A"/>
    <rect x="110" y="0" width="12" height="100" fill="#A87050" opacity="0.4"/>
    <rect x="135" y="0" width="8" height="100" fill="#A87050" opacity="0.3"/>
    <rect x="158" y="0" width="14" height="100" fill="#A87050" opacity="0.4"/>
    <rect x="182" y="0" width="10" height="100" fill="#A87050" opacity="0.3"/>
    <!-- Bottom-left: solid warm pink-brown -->
    <rect x="0" y="100" width="100" height="100" fill="#B07060"/>
    <!-- Bottom-right: dark with dots -->
    <rect x="100" y="100" width="100" height="100" fill="#5C3A28"/>
    <circle cx="120" cy="120" r="5" fill="#ffffff" opacity="0.15"/>
    <circle cx="145" cy="135" r="4" fill="#ffffff" opacity="0.12"/>
    <circle cx="165" cy="115" r="6" fill="#ffffff" opacity="0.10"/>
    <circle cx="130" cy="160" r="4" fill="#ffffff" opacity="0.12"/>
    <circle cx="175" cy="155" r="5" fill="#ffffff" opacity="0.10"/>
    <circle cx="110" cy="175" r="3" fill="#ffffff" opacity="0.12"/>
    <circle cx="155" cy="175" r="4" fill="#ffffff" opacity="0.10"/>
  </g>
  <!-- Subtle centre dividers -->
  <line x1="100" y1="0" x2="100" y2="200" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <line x1="0" y1="100" x2="200" y2="100" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
</svg>
