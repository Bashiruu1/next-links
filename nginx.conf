server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tiktokcdn.com; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" always;

    # Next.js static export: each route is a folder with index.html inside.
    # Try the exact path first, then path.html, then path/index.html.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Cache-bust immutable assets (JS/CSS chunks include a content hash).
    location ~* \.(js|css|woff2?|ttf|eot|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache HTML so that rebuilds are reflected immediately.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve /public assets (images etc.) with a reasonable cache.
    location ~* \.(png|jpg|jpeg|gif|svg|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
}
